# Wi-Fi: documented configuration values.
#
# Two networks exist and they are configured differently. Both carry the SSO
# credential, so server-certificate validation is mandatory on both: without it
# any access point broadcasting the same SSID can collect the password.

# --- eduroam: the one to use. Works here and at every other eduroam site. -----
eduroam_ssid: eduroam
eduroam_eap: PEAP
eduroam_phase2: MSCHAPv2

# Certificate authority that issues the RADIUS server certificate. Ships with
# the standard ca-certificates package on Arch, Debian and macOS, so there is
# nothing to download.
eduroam_ca: HARICA TLS RSA Root CA 2021

# The same certificate, in the place each distribution's bundle puts it. Two
# entries because a profile names a file: a page that offered one path would be
# wrong on the other system, and the reader has no way to tell which.
eduroam_ca_path_arch: /etc/ca-certificates/extracted/cadir/HARICA_TLS_RSA_Root_CA_2021.pem
eduroam_ca_path_debian: /etc/ssl/certs/HARICA_TLS_RSA_Root_CA_2021.pem

# The RADIUS server's certificate must match this domain. Without this check a
# rogue access point holding any certificate from the same CA is accepted.
eduroam_domain_suffix: rz.fh-ingolstadt.de

# Identity is the campus login with the realm appended.
eduroam_realm: thi.de

# Configuration assistant. Generates a profile with CA and server name already
# correct, which is why it is the recommended path.
cat_url: https://cat.eduroam.org/
cat_profile: "5182"

# --- @thi: campus-only, requires the device to be registered first. ----------
thi_ssid: "@thi"
thi_eap: TTLS
thi_phase2: MSCHAPv2
thi_ca: HARICA TLS RSA Root CA 2021
thi_domain_suffix: rz.fh-ingolstadt.de

# --- thi-onboard: the onboarding network used by the official Windows/macOS ---
# onboarding client. Linux support is limited; device registration is the
# documented alternative. See content/en/network/ethernet-802-1x.md.
onboard_ssid: thi-onboard

official_url: https://www.thi.de/service/it-service/wifi/
