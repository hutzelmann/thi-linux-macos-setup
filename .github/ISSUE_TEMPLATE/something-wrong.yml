name: Something is wrong on a page
description: A step does not work, a value has changed, or something is missing.
title: "[page] "
labels: [page-feedback]
body:
  - type: markdown
    attributes:
      value: |
        Thanks. This is the most useful kind of report.

        **Please remove usernames, mail addresses and home paths** from anything you
        paste. `<kennung>` and `/home/<kennung>` are fine as placeholders. This
        repository is public.

        If your own account or hardware is the problem, THI IT can actually fix it and
        this project cannot. Write to support@thi.de or see the
        [IT service pages](https://www.thi.de/service/it-service/).

  - type: input
    id: page
    attributes:
      label: Which page
      description: The address, or just its name.
      placeholder: /en/printing/marb-color
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Arch Linux
        - Debian / Ubuntu
        - macOS
        - Other Linux
        - Not relevant
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What went wrong
      description: What you expected, and what happened instead. Half a sentence is fine.
      placeholder: The PPD path in step 2 does not exist on Ubuntu 26.04.
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Command output, if any
      description: >
        Optional. `./scripts/<area>/verify.sh --json` produces output with identifiers
        already stripped.
      render: shell

  - type: textarea
    id: fix
    attributes:
      label: Do you know what the correct answer is?
      description: Optional, and no problem if not. Knowing something is wrong is already useful.
