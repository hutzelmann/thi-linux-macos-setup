# Blank issues are disabled on purpose. Without routing, an unofficial notes
# project becomes an unofficial help desk, and there is nobody staffing it.
blank_issues_enabled: false

contact_links:
  - name: My account, password, quota or hardware
    url: https://help.thi.de/
    about: >
      Official THI IT support. Anything about your account, print quota, licences
      or university hardware belongs there — they can act on it and this project
      cannot.

  - name: Something is broken and I need help right now
    url: https://help.thi.de/
    about: >
      This project has no support desk and makes no promises about response time.
      For an urgent problem, the official channel is faster.

  - name: How this project works
    url: https://hutzelmann.github.io/thi-linux-macos-setup/en/about/how-this-works
    about: What this is, what it never does, and how to contribute.
