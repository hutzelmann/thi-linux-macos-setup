# Blank issues are disabled on purpose. Without routing, an unofficial notes
# project becomes an unofficial help desk, and there is nobody staffing it.
blank_issues_enabled: false

contact_links:
  - name: My account, password, quota or hardware — official IT
    url: https://www.thi.de/service/it-service/
    about: >
      The university's own IT pages. Anything about your account, print quota,
      licences or university hardware belongs there — they can act on it and
      this project cannot.

  - name: Ask THI IT directly — support@thi.de
    url: mailto:support@thi.de
    about: >
      The IT service currently answers by mail. Use this for an actual problem
      with your account or a campus system. Faster than us, and they can
      actually change things.

  - name: Official knowledge base
    url: https://help.thi.de/help/de-de
    about: >
      THI's own public articles. Mostly Windows-oriented, which is why this
      project exists, but it is the authoritative source where it overlaps.

  - name: How this project works
    url: https://hutzelmann.github.io/thi-linux-macos-setup/en/about/how-this-works
    about: What this is, what it never does, and how to contribute.
