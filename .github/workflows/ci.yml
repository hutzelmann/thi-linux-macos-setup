name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # check-translations compares against the English source's blob hash,
          # which needs real history rather than a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Shell scripts
        run: npm run check:shell

      - name: No hardcoded values outside facts/
        run: npm run check:facts

      - name: No personal data
        run: npm run check:private

      - name: Translations match their source
        run: npm run check:translations

      - name: Build (fails on dead links)
        run: npm run build

      # The built site, downloadable from the run summary. GitHub Pages has no
      # native pull-request previews, and asking a first-time contributor to
      # install Node just to see their own change is how contributions die.
      - name: Upload preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-preview
          path: content/.vitepress/dist
          retention-days: 7

# The VPN chain check used to run here too, tolerated with continue-on-error.
# It reaches vpn.thi.de from a GitHub runner, which usually cannot get there
# inside the timeout, so the job was red on ten of twelve runs while the run
# itself stayed green. A job that is nearly always red teaches people to ignore
# red. It runs weekly in drift.yml, which is where a check of the campus
# belongs, and `npm run check:vpn-chain` runs it by hand from a machine that
# can actually reach the gateway.
